<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <meta name="theme-color" content="#245f49">
  <meta name="description" content="Interactive local browser preview of the LifeTrack Android app.">
  <title>LifeTrack · App preview</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Crect width='48' height='48' rx='13' fill='%231b1710'/%3E%3Cpath d='M8 38h10v-8h10v-8h8' fill='none' stroke='%23f1e8d4' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='m31 12 5 5 8-10' fill='none' stroke='%23ff7a33' stroke-width='4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="/styles.css?v=1.5.1">
  <link rel="stylesheet" href="/analytics.css?v=1.5.1">
  <script type="module" src="/app.js?v=1.5.1"></script>
</head>
<body>
  <a class="skip-link" href="#app-view">Skip to content</a>
  <div class="app-shell">
    <aside class="side-col">
      <header class="side-head">
        <a class="brand" href="/" aria-label="LifeTrack preview home"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 48 48"><rect width="48" height="48" rx="13" fill="#245f49"/><path d="M8 38h10v-8h10v-8h8" fill="none" stroke="#a4d7b5" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/><path d="m31 12 5 5 8-10" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><strong>LifeTrack.</strong></a>
        <p class="side-tag">Small steps. Your own pace.</p>
        <div class="head-tools">
          <span class="local-badge"><i></i> Running locally</span>
          <button data-action="reset-demo" class="text-button" title="Restore the sample habits">Reset demo ↻</button>
        </div>
      </header>
      <nav id="bottom-nav" class="app-nav" aria-label="Main navigation"></nav>
      <div class="side-foot">
        <span class="side-shield" aria-hidden="true">⌑</span>
        <strong>Private by design</strong>
        <small>Offline. No accounts.<br>Your progress stays yours.</small>
        <p class="side-fine">Interactive browser preview · sample data lives in this browser · the native Android app is supplied separately.</p>
      </div>
    </aside>
    <main id="app-view" class="app-view" tabindex="-1"></main>
    <aside id="today-rail" class="today-rail" aria-label="Today overview"></aside>
  </div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <dialog id="modal" aria-labelledby="modal-title"><div id="modal-content"></div></dialog>
  <input type="file" id="import-file" accept="application/json,.json" hidden>
</body>
</html>
