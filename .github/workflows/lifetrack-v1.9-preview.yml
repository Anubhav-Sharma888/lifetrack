name: Build LifeTrack v1.9.0 Preview APK

on:
  push:
    branches: [main]
    paths: [.github/workflows/lifetrack-v1.9-preview.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: lifetrack-v1.9-preview
  cancel-in-progress: false

jobs:
  preview-apk:
    if: github.repository == 'Anubhav-Sharma888/lifetrack'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0" "platform-tools"

      - name: Configure isolated preview
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle = Path('app/build.gradle.kts')
          text = gradle.read_text(encoding='utf-8')
          for expected in ('versionCode = 9', 'versionName = "1.9.0"', 'buildTypes {\n        release {'):
              assert expected in text, f'Unexpected build configuration: {expected}'
          text = text.replace('versionCode = 9', 'versionCode = 10', 1)
          text = text.replace('versionName = "1.9.0"', 'versionName = "1.9.0-preview.1"', 1)
          text = text.replace('buildTypes {\n        release {',
              'buildTypes {\n        getByName("debug") {\n            applicationIdSuffix = ".preview"\n        }\n        release {', 1)
          gradle.write_text(text, encoding='utf-8')
          manifest = Path('app/src/main/AndroidManifest.xml')
          text = manifest.read_text(encoding='utf-8')
          assert 'android:label="LifeTrack"' in text
          manifest.write_text(text.replace('android:label="LifeTrack"', 'android:label="LifeTrack 1.9 Preview"', 1), encoding='utf-8')
          PY

      - name: Build and verify
        shell: bash
        env:
          GRADLE_OPTS: -Xmx512m
        run: |
          chmod +x gradlew
          ./gradlew --max-workers=2 --no-parallel --no-daemon \
            "-Dorg.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8" \
            assembleDebug testDebugUnitTest lintDebug

      - name: Package APK and checksum
        shell: bash
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/LifeTrack-v1.9.0-preview.1.apk
          cd dist
          sha256sum LifeTrack-v1.9.0-preview.1.apk > LifeTrack-v1.9.0-preview.1.apk.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: LifeTrack-v1.9.0-preview.1
          path: dist/*
          if-no-files-found: error

      - name: Publish GitHub prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > dist/RELEASE-NOTES.md <<'EOF'
          LifeTrack v1.9.0 Preview 1 includes Mood Tracking and Daily Journal UI,
          Smart Streaks, App Lock, directional tracking, CSV export, and all earlier work.

          This is a debug-signed test build that installs separately as
          com.lifetrack.app.preview. It will not replace the existing LifeTrack app
          or share its local data. Do not uninstall the existing app to install it.
          EOF
          gh release create v1.9.0-preview.1 \
            dist/LifeTrack-v1.9.0-preview.1.apk \
            dist/LifeTrack-v1.9.0-preview.1.apk.sha256 \
            --target "$GITHUB_SHA" \
            --title "LifeTrack v1.9.0 Preview 1" \
            --notes-file dist/RELEASE-NOTES.md \
            --prerelease
